services:
  postgres:
    image: postgres:16-alpine
    container_name: worthout_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-worthout_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-worthout_pass}
      POSTGRES_DB: ${POSTGRES_DB:-worthout_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-worthout_user} -d ${POSTGRES_DB:-worthout_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: worthout_backend
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      ENVIRONMENT: development
      DEBUG: "True"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-worthout_user}:${POSTGRES_PASSWORD:-worthout_pass}@postgres:5432/${POSTGRES_DB:-worthout_db}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
